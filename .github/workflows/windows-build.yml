name: Windows 构建与发布

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Python 语法检查
        run: python -m compileall -q -x "(build|dist|\.venv)" .

      - name: 主窗口离屏启动检查
        run: python -c "from PySide6.QtWidgets import QApplication; from main import MainWindow; app = QApplication([]); window = MainWindow(); window.show(); app.processEvents(); window.close(); print('Main window smoke test passed')"

      - name: 构建 Windows 安装包
        run: python build_installer.py

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: KLinePicker-Windows-${{ github.ref_name }}
          path: dist/KLinePicker_Setup_*.exe
          if-no-files-found: error
          retention-days: 14

      - name: 标签推送时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-ChildItem "dist/KLinePicker_Setup_*.exe" | Select-Object -First 1
          if (-not $package) { throw "未找到安装包" }
          gh release create "${{ github.ref_name }}" "$($package.FullName)" --title "KLinePicker ${{ github.ref_name }}" --generate-notes
